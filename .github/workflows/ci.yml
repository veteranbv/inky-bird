name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR supersedes its old run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Timeouts are about 3x the slowest of the last 12 successful runs.
jobs:
  core-quality:
    name: Core quality
    runs-on: ubuntu-latest
    # Includes the full catalog checkout, which GitHub served in 415 s of a
    # 690 s successful run on 2026-11-03 (normally about 15 s of 240 s).
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" actionlint

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive"
          echo "${PWD}/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Validate workflows and deployment scripts
        run: |
          set -euo pipefail
          ./actionlint -color
          shellcheck deploy/*.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "false"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Validate public catalog
        run: uv run inky-bird-frame catalog validate --catalog catalog

      - name: Enforce add-only catalog contributions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_directory="$(mktemp -d)"
          trap 'rm -rf "$base_directory"' EXIT
          git archive "$BASE_SHA" catalog | tar -x -C "$base_directory"
          uv run inky-bird-frame catalog validate \
            --catalog catalog \
            --base-catalog "$base_directory/catalog"

      - name: Enforce workflow pinning and GitHub-hosted runners
        run: uv run python .github/scripts/check_workflow_pinning.py .github/workflows

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Check bundled browser modules and interaction regressions
        run: |
          for source in src/inky_bird_frame/web/*.js; do
            node --input-type=module --check < "$source"
          done
          node --test tests/web/*.test.mjs

      - name: MyPy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          access_env_file="$(mktemp)"
          compose_json="$(mktemp)"
          build_json="$(mktemp)"
          trap 'rm -f "$env_file" "$access_env_file" "$compose_json" "$build_json"' EXIT
          printf '%s\n' 'SECRET_BOUNDARY_SENTINEL=present' > "$env_file"
          printf '%s\n' 'ACCESS_BOUNDARY_SENTINEL=present' > "$access_env_file"
          INKY_BIRD_ENV="$env_file" INKY_ACCESS_ENV="$access_env_file" \
            docker compose config --format json > "$compose_json"
          INKY_BIRD_ENV="$env_file" docker compose \
            -f compose.yaml -f compose.build.yaml config \
            --no-path-resolution --format json > "$build_json"
          jq -e '
            .services.scheduler.environment.SECRET_BOUNDARY_SENTINEL == "present"
            and (.services.controller.environment.SECRET_BOUNDARY_SENTINEL == "present")
            and (.services.controller.environment.ACCESS_BOUNDARY_SENTINEL == "present")
            and (.services.scheduler.environment.ACCESS_BOUNDARY_SENTINEL == null)
            and (.services.bootstrap.environment.ACCESS_BOUNDARY_SENTINEL == null)
            and (.services["config-sync"].environment.ACCESS_BOUNDARY_SENTINEL == null)
            and (.services.bootstrap.environment.SECRET_BOUNDARY_SENTINEL == null)
            and (.services["config-sync"].environment.SECRET_BOUNDARY_SENTINEL == "present")
            and ([.services[] | .image] | all(. == "ghcr.io/veteranbv/inky-bird:latest"))
            and ([.services[] | .build] | all(. == null))
            and (.services.scheduler.security_opt | index("seccomp=unconfined") != null)
            and (.services.scheduler.security_opt | index("apparmor=unconfined") != null)
            and (.services.scheduler.security_opt | index("no-new-privileges:true") != null)
            and (.services.scheduler.cap_drop == ["ALL"])
            and (.services.scheduler.cap_add == null)
            and (.services["config-sync"].cap_drop == ["ALL"])
            and (.services["config-sync"].cap_add == ["CHOWN", "DAC_OVERRIDE"])
            and (.services["config-sync"].user == "0:0")
            and (.services["config-sync"].security_opt
              | index("no-new-privileges:true") != null)
            and (.services["config-sync"].network_mode == "none")
            and (.services["config-sync"].read_only == true)
            and (([.services["config-sync"].volumes[]
              | select(.target == "/run/inky/config.toml")]) as $mounts
              | ($mounts | length) == 1
                and $mounts[0].bind.selinux == "Z")
            and (.services.controller.security_opt | index("seccomp=unconfined") == null)
            and (.services.controller.security_opt | index("apparmor=unconfined") == null)
            and (.services.bootstrap.security_opt | index("seccomp=unconfined") == null)
            and (.services.bootstrap.security_opt | index("apparmor=unconfined") == null)
          ' "$compose_json"
          jq -e '
            [.services[]]
            | all(.build.context == "." and .build.target == "runtime" and .pull_policy == "build")
          ' "$build_json"

      - name: Build controller container
        run: |
          sudo install -m 0644 deploy/apparmor/inky-bird-frame-codex /etc/apparmor.d/inky-bird-frame-codex
          sudo apparmor_parser -r /etc/apparmor.d/inky-bird-frame-codex
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1"
          fi
          docker build --tag inky-bird-frame:ci .

      - name: Smoke-test controller container
        run: |
          set -euo pipefail
          compose_project="inky-bird-frame-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config_source="$(mktemp)"
          cleanup() {
            INKY_BIRD_IMAGE=inky-bird-frame:ci INKY_BIRD_CONFIG="$config_source" \
              docker compose -p "$compose_project" down --volumes --remove-orphans || true
            rm -f "$config_source"
          }
          trap cleanup EXIT
          cp config.example.toml "$config_source"
          chmod 600 "$config_source"
          test "$(stat -c %u "$config_source")" != "10001"
          docker run --rm inky-bird-frame:ci --help
          docker run --rm inky-bird-frame:ci --version
          docker run --rm --entrypoint codex inky-bird-frame:ci --version
          run_sandbox() {
            docker run --rm --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --security-opt seccomp=unconfined \
              --security-opt apparmor=unconfined \
              --pids-limit 256 \
              --tmpfs /tmp:size=256m,mode=1777 \
              --tmpfs /data:uid=10001,gid=10001 \
              --tmpfs /home/inky/.codex:uid=10001,gid=10001 \
              --entrypoint codex inky-bird-frame:ci sandbox -- "$@"
          }
          run_sandbox /bin/true
          if run_sandbox python -c \
            "import socket; socket.create_connection(('1.1.1.1', 443), timeout=1)"; then
            echo "Codex sandbox unexpectedly allowed network access" >&2
            exit 1
          fi
          docker run --rm --entrypoint gh inky-bird-frame:ci --version
          docker run --rm --entrypoint test inky-bird-frame:ci \
            -s /usr/share/licenses/inky-bird-frame/third-party/codex/LICENSE
          docker run --rm --entrypoint test inky-bird-frame:ci \
            -s /usr/share/licenses/inky-bird-frame/third-party/codex/NOTICE
          docker run --rm --entrypoint test inky-bird-frame:ci \
            -s /usr/share/licenses/inky-bird-frame/third-party/github-cli/LICENSE
          docker run --rm --entrypoint test inky-bird-frame:ci \
            -s /usr/share/licenses/inky-bird-frame/THIRD_PARTY_NOTICES.md
          docker run --rm inky-bird-frame:ci catalog validate --catalog /app/catalog
          INKY_BIRD_IMAGE=inky-bird-frame:ci INKY_BIRD_CONFIG="$config_source" \
            docker compose -p "$compose_project" run --rm --no-deps config-sync
          INKY_BIRD_IMAGE=inky-bird-frame:ci INKY_BIRD_CONFIG="$config_source" \
            docker compose -p "$compose_project" run --rm --no-deps \
            --entrypoint python scheduler -c \
            "from pathlib import Path; import stat; from inky_bird_frame.config import load_config; path = Path('/data/config.toml'); metadata = path.stat(); assert metadata.st_uid == 10001; assert metadata.st_gid == 10001; assert stat.S_IMODE(metadata.st_mode) == 0o600; config = load_config(path); assert config.controller.workspace_dir == Path('/data/workspace'); assert set(p.name for p in path.parent.iterdir()) == {'config.toml'}"
          # Only this fresh disposable CI volume is prepared. Normal Compose
          # startup and upgrades must never grant network account creation.
          INKY_BIRD_IMAGE=inky-bird-frame:ci INKY_BIRD_CONFIG="$config_source" \
            docker compose -p "$compose_project" run --rm --no-deps controller \
            access prepare --new-installation --config /data/config.toml
          INKY_BIRD_IMAGE=inky-bird-frame:ci INKY_BIRD_CONFIG="$config_source" \
            docker compose -p "$compose_project" run --rm --no-deps \
            --entrypoint python controller -c \
            "from pathlib import Path; from inky_bird_frame.config import load_config; from inky_bird_frame.access import AccessStore; c = load_config(Path('/data/config.toml'), load_secrets=False); s = AccessStore(c.controller.state_dir).setup_status(); assert s is not None and s.state == 'missing'"

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      # Compatibility runs test code, not catalog data: skip the species
      # images (over 1 GB). Core quality validates them from a full checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/catalog/species/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "false"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # The installer matrix runs in full in its own shards and in default form in
      # Core quality. It tests shell installers against fakes, not this Python.
      - name: Run tests
        run: uv run pytest -m "not repository_catalog" --ignore=tests/test_installer_matrix.py

  browser-acceptance:
    name: Browser acceptance
    runs-on: ubuntu-latest
    # No run history yet: about 2 minutes locally plus browser installation.
    timeout-minutes: 20
    steps:
      # The journeys need only the plates tests/web/e2e-harness.cjs and
      # frame.e2e.cjs copy, not the whole catalog.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/catalog/species/*/*.png
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the fixture plates
        run: |
          set -euo pipefail
          # Cardinal and robin by name, then the first other species, as the journeys pick them.
          mapfile -t folders < <(jq -r '
            [.species[] | select(.common_name == "Northern Cardinal")][0],
            [.species[] | select(.common_name == "American Robin")][0],
            [.species[]
              | select(.common_name != "Northern Cardinal" and .common_name != "American Robin")][0]
            | .portrait_path | split("/")[0:2] | join("/")
          ' catalog/index.json)
          test "${#folders[@]}" -eq 3
          patterns=()
          for folder in "${folders[@]}"; do
            patterns+=("/catalog/${folder}/*.png")
          done
          git sparse-checkout add "${patterns[@]}"
          for folder in "${folders[@]}"; do
            test -s "catalog/${folder}/portrait.png"
          done

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "false"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # Exact versions, including the peer packages npm would otherwise float.
      - name: Install pinned browser test tools
        env:
          PLAYWRIGHT_VERSION: "1.62.1"
          AXE_CORE_VERSION: "4.14.0"
          AXE_PLAYWRIGHT_VERSION: "4.14.0"
        run: |
          set -euo pipefail
          qa_tools="${RUNNER_TEMP}/qa-tools"
          npm install --prefix "$qa_tools" --ignore-scripts --no-audit --no-fund --save-exact \
            "playwright@${PLAYWRIGHT_VERSION}" "playwright-core@${PLAYWRIGHT_VERSION}" \
            "axe-core@${AXE_CORE_VERSION}" "@axe-core/playwright@${AXE_PLAYWRIGHT_VERSION}"
          for package in playwright playwright-core axe-core @axe-core/playwright; do
            npm ls --prefix "$qa_tools" --all "$package" > /dev/null
          done
          test "$(node -p "require('${qa_tools}/node_modules/playwright-core/package.json').version")" \
            = "$PLAYWRIGHT_VERSION"
          "$qa_tools/node_modules/.bin/playwright" install --with-deps chromium

      # The log names the failing phase and, for a layout check, the window
      # and every measured box.
      - name: Run the browser journeys
        run: |
          set -euo pipefail
          qa_tools="${RUNNER_TEMP}/qa-tools"
          mkdir -p "${RUNNER_TEMP}/browser-evidence"
          INKY_QA_EVIDENCE_DIR="${RUNNER_TEMP}/browser-evidence" \
          INKY_QA_PLAYWRIGHT="$qa_tools/node_modules/playwright" \
          INKY_QA_AXE="$qa_tools/node_modules/@axe-core/playwright" \
            node tests/web/journal.e2e.cjs

      # The evidence is synthetic by construction (tests/web/e2e-harness.cjs):
      # a fresh configuration, a random per-run password whose sessions end
      # with the run, synthetic history and screenshots of them. The copied
      # public plates are left out.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-journey-evidence
          path: |
            ${{ runner.temp }}/browser-evidence/
            !${{ runner.temp }}/browser-evidence/*/catalog/**
          retention-days: 7

  installer-matrix:
    name: Installer matrix ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # No run history yet: about 3x the expected 12 minutes per shard.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # The matrix runs synthetic installs, not catalog data: skip the images.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/catalog/species/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The job always reports, so it can be required; the matrix itself runs
      # only when the installers, their tests or this workflow change.
      - name: Check for installer changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$EVENT_NAME" != pull_request ]; then
            base="$BEFORE_SHA"
          fi
          run=true
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null && \
              git diff --quiet "$base" HEAD -- deploy tests/fake_bin \
                tests/test_installer_matrix.py tests/test_installer_behaviour.py \
                tests/test_deployment_scripts.py tests/test_installation.py \
                src/inky_bird_frame/installation.py src/inky_bird_frame/upgrade_gates.py \
                pyproject.toml uv.lock \
                .github/workflows/ci.yml; then
            run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "false"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --extra dev --locked

      - name: Run the full installer matrix shard
        if: steps.changes.outputs.run == 'true'
        env:
          INKY_INSTALLER_MATRIX: full
          INKY_MATRIX_SHARD: ${{ matrix.shard }}/8
          INKY_MATRIX_WORKERS: "4"
        run: uv run pytest tests/test_installer_matrix.py -p no:cacheprovider

  # The macOS installers again under the Bash 3.2 that macOS ships, which the
  # Linux shards do not have.
  installer-matrix-macos:
    name: Installer matrix macOS ${{ matrix.shard }}/2
    runs-on: macos-latest
    # No run history yet: both shards together take about 6 minutes on four
    # local workers.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # The matrix runs synthetic installs, not catalog data: skip the images.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/catalog/species/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The job always reports, so it can be required; the matrix itself runs
      # only when the installers, their tests or this workflow change.
      - name: Check for installer changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ "$EVENT_NAME" != pull_request ]; then
            base="$BEFORE_SHA"
          fi
          run=true
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null && \
              git diff --quiet "$base" HEAD -- deploy tests/fake_bin \
                tests/test_installer_matrix.py tests/test_installer_behaviour.py \
                tests/test_deployment_scripts.py tests/test_installation.py \
                src/inky_bird_frame/installation.py src/inky_bird_frame/upgrade_gates.py \
                pyproject.toml uv.lock \
                .github/workflows/ci.yml; then
            run=false
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "false"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --extra dev --locked

      - name: Check the macOS shell is Bash 3.2
        if: steps.changes.outputs.run == 'true'
        run: /bin/bash -c 'test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2'

      - name: Run the macOS groups of the full installer matrix
        if: steps.changes.outputs.run == 'true'
        env:
          INKY_INSTALLER_MATRIX: full
          INKY_INSTALLER_MATRIX_ONLY: "install:macos:*,install:macos-hook:*,uninstall:macos:*"
          INKY_MATRIX_SHARD: ${{ matrix.shard }}/2
          INKY_MATRIX_WORKERS: "4"
        run: uv run pytest tests/test_installer_matrix.py -p no:cacheprovider

  quality:
    name: quality
    if: always()
    needs:
      - core-quality
      - python-compatibility
      - browser-acceptance
      - installer-matrix
      - installer-matrix-macos
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          CORE_RESULT: ${{ needs.core-quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.python-compatibility.result }}
          BROWSER_RESULT: ${{ needs.browser-acceptance.result }}
          MATRIX_RESULT: ${{ needs.installer-matrix.result }}
          MACOS_MATRIX_RESULT: ${{ needs.installer-matrix-macos.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$MATRIX_RESULT" = "success"
          test "$MACOS_MATRIX_RESULT" = "success"
