name: codeql

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Re-scan each Monday at 06:00 UTC so new CodeQL queries run without a code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push to a PR supersedes its old scan; main and scheduled runs are never
# cancelled.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    # Slowest of the last 12 successful runs: 3.1 min.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # The workflows, the shipped browser modules and the Python package.
          languages: actions,javascript-typescript,python

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
